services:
  
  hadoop-permissions:
    image: apache/hadoop:3.5.0
    user: "0:0"
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /namenode /datanode1 /datanode2
        chown -R 1001:100 /namenode /datanode1 /datanode2
    volumes:
      - namenode_data:/namenode
      - datanode1_data:/datanode1
      - datanode2_data:/datanode2
    restart: "no"
  # =========================
  # HADOOP - NAMENODE
  # =========================
  namenode:
    image: apache/hadoop:3.5.0
    container_name: hadoop-namenode
    hostname: namenode
    command: ["/opt/hadoop/bin/hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/hadoop/dfs
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - bigdata-net
    restart: unless-stopped
    depends_on:
      hadoop-permissions:
        condition: service_completed_successfully

  # =========================
  # HADOOP - DATANODE 1
  # =========================
  datanode1:
    image: apache/hadoop:3.5.0
    container_name: hadoop-datanode1
    hostname: datanode1
    command: ["/opt/hadoop/bin/hdfs", "datanode"]
    environment:
      WAITFOR: namenode:8020
    ports:
      - "9864:9864"
    volumes:
      - datanode1_data:/hadoop/dfs
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      namenode:
        condition: service_started
      hadoop-permissions:
        condition: service_completed_successfully
    networks:
      - bigdata-net
    restart: unless-stopped

  # =========================
  # HADOOP - DATANODE 2
  # =========================
  datanode2:
    image: apache/hadoop:3.5.0
    container_name: hadoop-datanode2
    hostname: datanode2
    command: ["/opt/hadoop/bin/hdfs", "datanode"]
    environment:
      WAITFOR: namenode:8020
    ports:
      - "9865:9864"
    volumes:
      - datanode2_data:/hadoop/dfs
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      namenode:
        condition: service_started
      hadoop-permissions:
        condition: service_completed_successfully
    networks:
      - bigdata-net
    restart: unless-stopped
  # =========================
  # KAFKA - KRAFT MODE
  # =========================
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka-broker
    hostname: kafka
    ports:
      - "9094:9094"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata-net
    restart: unless-stopped
  # =========================
  # SPARK - MASTER
  # =========================
  spark-master:
    image: apache/spark:4.0.1
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net
    restart: unless-stopped

  # =========================
  # SPARK - WORKER 1
  # =========================
  spark-worker1:
    image: apache/spark:4.0.1
    container_name: spark-worker1
    hostname: spark-worker1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - bigdata-net
    restart: unless-stopped

  # =========================
  # SPARK - WORKER 2
  # =========================
  spark-worker2:
    image: apache/spark:4.0.1
    container_name: spark-worker2
    hostname: spark-worker2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    networks:
      - bigdata-net
    restart: unless-stopped
networks:
  bigdata-net:
    driver: bridge

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  kafka_data:
